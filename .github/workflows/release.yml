name: Release

# 触发方式：
#   1. 推送 v* 标签时自动构建签名 APK 并挂到对应 Release
#   2. 手动触发（需填 tag 名），Release 已存在则替换 APK，不存在则自动创建
#
# 签名密钥不入库，全部从仓库 Secrets 注入：
#   KEYSTORE_BASE64     —— keyvault-release.jks 的 base64（base64 -w 0 keyvault-release.jks）
#   KEYSTORE_PASSWORD   —— keystore 密码
#   KEY_ALIAS           —— 别名（keyvault）
#   KEY_PASSWORD        —— 私钥密码
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布到的标签，例如 v1.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 把 base64 还原成 jks，写回项目根；两个文件都在 .gitignore 里，不会被提交
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keyvault-release.jks

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=keyvault-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease

      # 验签：确认产出的 APK 真的被我们的密钥签名了，而不是悄悄退化成未签名
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs \
              androidApp/build/outputs/apk/release/androidApp-release.apk
          else
            echo "未找到 apksigner，跳过验签"
          fi

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="KeyVault-$RELEASE_TAG.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$APK"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            gh release create "$RELEASE_TAG" --generate-notes "$APK"
          fi

      - name: Clean up signing files
        if: always()
        run: rm -f keyvault-release.jks keystore.properties
